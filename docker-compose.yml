version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workpulse-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=workpulse_production_secure_jwt_secret_key_2025
    volumes:
      - app-data:/app/data

volumes:
  app-data:
